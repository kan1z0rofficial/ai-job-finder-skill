name: Баг
description: Скилл работает не так, как описано
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Пожалуйста, не прикладывайте персональные данные и резюме.
  - type: input
    id: agent
    attributes:
      label: Агент и модель
      description: Например, Claude Code 2.x + Sonnet 4.5, ChatGPT, Codex
      placeholder: Claude Code, Sonnet
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия скилла
      description: Тег релиза или дата коммита
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Запрос пользователя
      description: Что вы написали агенту
      placeholder: Найди работу сварщиком в Тюмени, вахта
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Ответ агента, скриншот или лог
    validations:
      required: true
  - type: dropdown
    id: web
    attributes:
      label: Включён ли у агента веб-поиск или браузер?
      options:
        - "Да"
        - "Нет"
        - "Не знаю"
    validations:
      required: true
